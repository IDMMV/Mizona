<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>MiZona V8 Enterprise · Prototipo Maestro</title>
  <style>
:root{
  --bg:#f5f7fb; --panel:#ffffff; --panel2:#f9fbff; --ink:#15213a; --muted:#6c7488;
  --primary:#2563eb; --primary2:#0ea5e9; --accent:#f97316; --good:#16a34a; --warn:#f59e0b; --danger:#dc2626;
  --line:#e7ecf5; --shadow:0 18px 45px rgba(16,24,40,.08); --radius:22px;
}
*{box-sizing:border-box} body{margin:0;background:linear-gradient(135deg,#eff6ff,#f8fafc 38%,#fff7ed);font-family:Inter,system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif;color:var(--ink)}
.app-shell{display:grid;grid-template-columns:292px 1fr;min-height:100vh}.sidebar{background:#0f172a;color:#e5edf9;padding:22px;display:flex;flex-direction:column;gap:18px;position:sticky;top:0;height:100vh}.brand{display:flex;align-items:center;gap:12px}.brand-mark{width:48px;height:48px;border-radius:16px;background:linear-gradient(135deg,#60a5fa,#f97316);display:grid;place-items:center;font-weight:900}.brand h1{font-size:22px;margin:0}.brand span{font-size:12px;color:#93a4bd}.nav{display:flex;flex-direction:column;gap:7px;overflow:auto;padding-right:4px}.nav button{border:0;background:transparent;color:#cbd5e1;text-align:left;padding:12px 13px;border-radius:15px;display:flex;align-items:center;justify-content:space-between;gap:10px;cursor:pointer;font-weight:700}.nav button:hover,.nav button.active{background:rgba(255,255,255,.1);color:white}.nav small{font-size:10px;color:#fde68a;background:rgba(245,158,11,.14);padding:3px 7px;border-radius:999px}.sidebar-footer{margin-top:auto}.mini-card{background:rgba(255,255,255,.09);border:1px solid rgba(255,255,255,.11);border-radius:18px;padding:14px}.mini-card span{display:block;color:#cbd5e1;font-size:12px;margin-top:6px}.main{min-width:0}.topbar{height:82px;display:flex;gap:14px;align-items:center;padding:18px 26px;position:sticky;top:0;background:rgba(245,247,251,.82);backdrop-filter:blur(14px);z-index:10;border-bottom:1px solid rgba(231,236,245,.7)}.search-box{flex:1;background:white;border:1px solid var(--line);border-radius:18px;padding:0 16px;display:flex;align-items:center;gap:10px;box-shadow:0 10px 30px rgba(15,23,42,.04)}.search-box input{height:48px;border:0;outline:none;width:100%;font-size:15px}.pill,.avatar,.icon-btn{border:0;border-radius:999px;background:white;color:var(--ink);font-weight:800;padding:13px 16px;box-shadow:0 10px 30px rgba(15,23,42,.06)}.avatar{width:48px;height:48px;padding:0;background:#1d4ed8;color:white}.view{padding:28px;max-width:1440px;margin:0 auto}.hero{display:grid;grid-template-columns:1.3fr .7fr;gap:22px;margin-bottom:22px}.hero-card{background:linear-gradient(135deg,#1d4ed8,#0ea5e9);color:white;border-radius:30px;padding:30px;box-shadow:var(--shadow);position:relative;overflow:hidden}.hero-card:after{content:"";position:absolute;right:-90px;top:-90px;width:260px;height:260px;background:rgba(255,255,255,.15);border-radius:50%}.hero-card h2{font-size:36px;margin:0 0 10px}.hero-card p{font-size:17px;max-width:700px;color:#e0f2fe}.hero-actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:20px}.btn{border:0;border-radius:15px;padding:13px 16px;font-weight:900;cursor:pointer;background:#111827;color:white}.btn.white{background:white;color:#1d4ed8}.btn.ghost{background:#eef2ff;color:#1e40af}.btn.orange{background:#f97316;color:white}.stat-panel{background:var(--panel);border:1px solid var(--line);border-radius:30px;padding:22px;box-shadow:var(--shadow)}.stat-panel h3{margin:0 0 16px}.stat-row{display:flex;justify-content:space-between;padding:13px 0;border-bottom:1px solid var(--line)}.stat-row:last-child{border-bottom:0}.grid{display:grid;gap:18px}.grid.cols-4{grid-template-columns:repeat(4,minmax(0,1fr))}.grid.cols-3{grid-template-columns:repeat(3,minmax(0,1fr))}.grid.cols-2{grid-template-columns:repeat(2,minmax(0,1fr))}.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:20px;box-shadow:0 12px 35px rgba(15,23,42,.05)}.card h3{margin:0 0 10px}.card p{color:var(--muted);line-height:1.5}.module-card{display:flex;gap:15px;align-items:flex-start;min-height:145px}.module-icon{font-size:28px;width:54px;height:54px;border-radius:18px;background:#eff6ff;display:grid;place-items:center}.tag{display:inline-flex;align-items:center;gap:6px;border-radius:999px;padding:5px 9px;font-size:12px;font-weight:900}.tag.active{background:#dcfce7;color:#166534}.tag.beta{background:#fef3c7;color:#92400e}.tag.off{background:#e2e8f0;color:#475569}.tag.maint{background:#fee2e2;color:#991b1b}.section-title{display:flex;align-items:end;justify-content:space-between;margin:30px 0 14px}.section-title h2{margin:0;font-size:26px}.section-title p{margin:6px 0 0;color:var(--muted)}.timeline{display:flex;flex-direction:column;gap:12px}.activity{display:flex;gap:12px;align-items:flex-start;padding:14px;border-radius:18px;background:#f8fafc;border:1px solid var(--line)}.activity b{display:block}.activity span{color:var(--muted);font-size:13px}.table{width:100%;border-collapse:collapse}.table th,.table td{text-align:left;border-bottom:1px solid var(--line);padding:14px}.table th{color:#64748b;font-size:12px;text-transform:uppercase}.switch{border:0;border-radius:999px;padding:8px 12px;font-weight:900;cursor:pointer}.screen-tabs{display:flex;gap:8px;flex-wrap:wrap;margin:16px 0}.screen-tabs button{border:1px solid var(--line);background:white;border-radius:999px;padding:10px 14px;font-weight:800;cursor:pointer}.screen-tabs button.active{background:#1d4ed8;color:white}.mock-phone{width:310px;max-width:100%;border:10px solid #111827;border-radius:38px;background:white;box-shadow:var(--shadow);overflow:hidden}.phone-top{height:38px;background:#111827}.phone-content{padding:18px}.phone-card{border:1px solid var(--line);border-radius:18px;padding:12px;margin-bottom:10px;background:#f8fafc}.admin-layout{display:grid;grid-template-columns:1fr 360px;gap:18px}.phase{display:grid;grid-template-columns:90px 1fr;gap:14px;align-items:start}.phase-number{background:#eef2ff;color:#1d4ed8;border-radius:18px;padding:12px;text-align:center;font-weight:900}.notice{border:1px dashed #93c5fd;background:#eff6ff;border-radius:18px;padding:16px;color:#1e3a8a}.mobile-only{display:none}.footer-note{margin:30px 0 10px;color:#64748b;font-size:13px;text-align:center}
@media(max-width:980px){.app-shell{grid-template-columns:1fr}.sidebar{position:fixed;z-index:50;transform:translateX(-104%);transition:.25s}.sidebar.open{transform:translateX(0)}.mobile-only{display:block}.topbar{padding:12px}.pill{display:none}.view{padding:18px}.hero,.admin-layout{grid-template-columns:1fr}.grid.cols-4,.grid.cols-3,.grid.cols-2{grid-template-columns:1fr}.hero-card h2{font-size:28px}}

  </style>
</head>
<body>
  <div class="app-shell">
    <aside class="sidebar" id="sidebar">
      <div class="brand">
        <div class="brand-mark">MZ</div>
        <div>
          <h1>MiZona</h1>
          <span>Enterprise V8</span>
        </div>
      </div>
      <nav class="nav" id="mainNav"></nav>
      <div class="sidebar-footer">
        <div class="mini-card">
          <strong>Fase actual</strong>
          <span>Fase 2 · Apariencia completa</span>
        </div>
      </div>
    </aside>

    <main class="main">
      <header class="topbar">
        <button class="icon-btn mobile-only" id="toggleSidebar">☰</button>
        <div class="search-box">
          <span>🔎</span>
          <input id="globalSearch" placeholder="¿Qué necesitas hoy? ofertas, colegio, trabajo, gasfitero..." />
        </div>
        <button class="pill">📍 Ventanilla · Pachacútec</button>
        <button class="avatar">JH</button>
      </header>

      <section id="view"></section>
    </main>
  </div>

  <script>
const modules = [
  {id:'panel', icon:'🏠', name:'Mi Panel', status:'active'},
  {id:'comunidad', icon:'👥', name:'Mi Comunidad', status:'active'},
  {id:'chat', icon:'💬', name:'MiZona Chat', status:'beta'},
  {id:'beneficios', icon:'🎁', name:'Beneficios', status:'beta'},
  {id:'negocios', icon:'🏪', name:'Negocios', status:'beta'},
  {id:'servicios', icon:'🛠️', name:'Servicios', status:'off'},
  {id:'marketplace', icon:'🛒', name:'Marketplace', status:'off'},
  {id:'business', icon:'💼', name:'MiZona Business', status:'off'},
  {id:'campus', icon:'🎓', name:'CampusHugo', status:'off'},
  {id:'ride', icon:'🚕', name:'MiZona Ride', status:'off'},
  {id:'admin', icon:'⚙️', name:'Centro de Control', status:'active'},
  {id:'design', icon:'🎨', name:'Design System', status:'active'}
];
const statusLabel = {active:'Activo', beta:'Pruebas', off:'Próximamente', maint:'Mantenimiento'};
const statusClass = {active:'active', beta:'beta', off:'off', maint:'maint'};
let current = 'panel';
function nav(){
  const el=document.getElementById('mainNav');
  el.innerHTML=modules.map(m=>`<button class="${current===m.id?'active':''}" onclick="go('${m.id}')"><span>${m.icon} ${m.name}</span>${m.status!=='active'?`<small>${statusLabel[m.status]}</small>`:''}</button>`).join('');
}
function tag(s){return `<span class="tag ${statusClass[s]}">● ${statusLabel[s]}</span>`}
function go(id){current=id; nav(); render(); document.getElementById('sidebar').classList.remove('open')}
function render(){document.getElementById('view').className='view'; document.getElementById('view').innerHTML = views[current] ? views[current]() : coming(current)}
const views={
panel:()=>`<div class="hero"><div class="hero-card"><h2>¿Qué necesitas hoy, José?</h2><p>MiZona empieza resolviendo problemas reales: colegio, comunidad, chat seguro, oportunidades y beneficios de tu zona.</p><div class="hero-actions"><button class="btn white">🔎 Buscar solución</button><button class="btn orange">🏫 Ver mi colegio</button><button class="btn ghost">💬 Abrir MiZona Chat</button></div></div><div class="stat-panel"><h3>Radar de hoy</h3><div class="stat-row"><span>🏫 Comunicados escolares</span><b>3</b></div><div class="stat-row"><span>💬 Chats activos</span><b>12</b></div><div class="stat-row"><span>🎁 Beneficios en pruebas</span><b>8</b></div><div class="stat-row"><span>🚧 Módulos futuros</span><b>6</b></div></div></div><div class="section-title"><div><h2>Etapas visibles desde ahora</h2><p>Todo existe en estructura, pero el administrador decide qué se activa.</p></div></div><div class="grid cols-4">${modules.filter(m=>m.id!=='admin'&&m.id!=='design').map(m=>`<div class="card module-card"><div class="module-icon">${m.icon}</div><div><h3>${m.name}</h3>${tag(m.status)}<p>${desc(m.id)}</p></div></div>`).join('')}</div><div class="section-title"><div><h2>Actividad útil</h2><p>No será un muro de Facebook. Será actividad que resuelve necesidades.</p></div></div><div class="grid cols-2"><div class="card"><h3>📍 Cambios importantes</h3><div class="timeline"><div class="activity">🏫 <div><b>Colegio San Martín</b><span>Publicó comunicado para padres.</span></div></div><div class="activity">💬 <div><b>Aula Chat</b><span>Grupo “Trabajo de Ciencia” activo por 7 días.</span></div></div><div class="activity">🎁 <div><b>Beneficio local</b><span>Próximamente: cupones de ahorro por zona.</span></div></div></div></div><div class="card"><h3>🧭 Filosofía V8</h3><p>Primero resolvemos problemas actuales de colegios, comités y comunidades. Luego activamos beneficios, negocios, Business, Ride y CampusHugo desde el administrador.</p><div class="notice">Regla: los módulos futuros se muestran como “Próximamente” o “Mantenimiento”, nunca como pantallas rotas.</div></div></div>`,
comunidad:()=>`<div class="section-title"><div><h2>👥 Mi Comunidad</h2><p>Primer motor de crecimiento: colegios, comités, urbanizaciones, clubes, empresas e iglesias.</p></div>${tag('active')}</div><div class="grid cols-3"><div class="card"><h3>🏫 Colegio</h3><p>Comunicados, aula chat, tareas, archivos temporales, eventos, encuestas y grupos de trabajo.</p><button class="btn">Abrir ejemplo</button></div><div class="card"><h3>🏘️ Comité / Urbanización</h3><p>Avisos, acuerdos, eventos, documentos, cuotas futuras y mensajes oficiales.</p><button class="btn ghost">Próximamente</button></div><div class="card"><h3>⚽ Club / Asociación</h3><p>Actividades, inscripciones, calendario, galería y comunicados.</p><button class="btn ghost">Próximamente</button></div></div><div class="section-title"><div><h2>Panel colegio</h2><p>Apariencia base para el primer módulo operativo.</p></div></div><div class="grid cols-4"><div class="card"><h3>📢 Comunicados</h3><p>Publicación oficial con opción de compartir por WhatsApp, Facebook, Instagram y QR.</p></div><div class="card"><h3>💬 Aula Chat</h3><p>Chats y grupos solo del mismo colegio. Mensajes y archivos expiran en 7 días.</p></div><div class="card"><h3>📁 Tareas y archivos</h3><p>Adjuntos pequeños en chat. Archivos pesados por MiZona Transfer.</p></div><div class="card"><h3>📅 Eventos</h3><p>Actuaciones, reuniones, actividades y recordatorios.</p></div></div>`,
chat:()=>`<div class="section-title"><div><h2>💬 MiZona Chat</h2><p>Identidad digital con usuario único. No depende del número de celular.</p></div>${tag('beta')}</div><div class="grid cols-3"><div class="card"><h3>🔐 Identidad</h3><p>Usuario único, foto de perfil, reglas contra nombres vulgares, correo único y control antifraude.</p></div><div class="card"><h3>🔎 Búsqueda segura</h3><p>Solo por nombre de usuario exacto. Sin búsqueda pública de escolares.</p></div><div class="card"><h3>🏫 Aula Chat</h3><p>Sin chat entre colegios al inicio. Grupos por salón y trabajos. Archivos 7 días.</p></div></div><div class="grid cols-2"><div class="card"><h3>Reglas iniciales</h3><table class="table"><tr><th>Caso</th><th>Regla</th></tr><tr><td>Adulto ↔ Adulto</td><td>Solicitud por usuario exacto</td></tr><tr><td>Alumno ↔ Alumno</td><td>Solo mismo colegio/salón</td></tr><tr><td>Entre colegios</td><td>Desactivado</td></tr><tr><td>Archivos</td><td>Vencen en 7 días</td></tr><tr><td>Videollamada</td><td>Próximamente</td></tr></table></div><div class="card"><h3>MiZona Transfer</h3><p>Subida temporal para archivos pesados de tareas o trabajos.</p><div class="notice">Los chats quedan visibles solo 7 días. Luego se eliminan mensajes y adjuntos para cuidar el almacenamiento gratuito.</div></div></div>`,
beneficios:()=>`<div class="section-title"><div><h2>🎁 Beneficios</h2><p>Motor de frecuencia futura: ahorro, cupones, oportunidades y promociones.</p></div>${tag('beta')}</div><div class="grid cols-3"><div class="card"><h3>🔥 Ofertas</h3><p>Se activará cuando existan comunidades y usuarios suficientes.</p></div><div class="card"><h3>🏷️ Cupones</h3><p>Medición por QR o código para demostrar resultados.</p></div><div class="card"><h3>📊 Resultados</h3><p>Vistas, guardados, canjes, clientes confirmados.</p></div></div>`,
negocios:()=>`<div class="section-title"><div><h2>🏪 Negocios</h2><p>Los negocios llegan después de crear usuarios mediante comunidades.</p></div>${tag('beta')}</div><div class="grid cols-3"><div class="card"><h3>Perfil gratuito</h3><p>Nombre, rubro, ubicación, horario, contacto y reseñas.</p></div><div class="card"><h3>Verificado MiZona</h3><p>Logo, promociones, chat, cupones y estadísticas.</p></div><div class="card"><h3>Activar Business</h3><p>Cuando el negocio quiera gestionar ventas, caja, reportes e inventario.</p></div></div>`,
admin:()=>`<div class="section-title"><div><h2>⚙️ Centro de Control MiZona</h2><p>El administrador controla la evolución completa de la plataforma.</p></div>${tag('active')}</div><div class="admin-layout"><div class="card"><h3>Módulos del sistema</h3><table class="table"><tr><th>Módulo</th><th>Estado</th><th>Visible</th><th>Acción</th></tr>${modules.filter(m=>m.id!=='admin').map(m=>`<tr><td>${m.icon} ${m.name}</td><td>${tag(m.status)}</td><td>${m.status==='off'?'No':'Sí'}</td><td><button class="switch">Configurar</button></td></tr>`).join('')}</table></div><div class="card"><h3>Controles globales</h3><p>Desde aquí se habilita, desactiva, pone en mantenimiento o cambia el orden de cada módulo.</p><div class="timeline"><div class="activity">🟢 <div><b>Activo</b><span>Visible y operativo.</span></div></div><div class="activity">🟡 <div><b>Pruebas</b><span>Visible para usuarios definidos.</span></div></div><div class="activity">🔴 <div><b>Mantenimiento</b><span>Mensaje de pausa temporal.</span></div></div><div class="activity">⚪ <div><b>Desactivado</b><span>Se muestra como Próximamente o se oculta.</span></div></div></div></div></div>`,
design:()=>`<div class="section-title"><div><h2>🎨 Design System V8</h2><p>Base visual que usaremos para todas las pantallas futuras.</p></div>${tag('active')}</div><div class="grid cols-3"><div class="card"><h3>Colores</h3><p>Azul confianza, naranja oportunidad, verde acción, fondos claros y modo oscuro futuro.</p><button class="btn">Botón principal</button> <button class="btn ghost">Secundario</button></div><div class="card"><h3>Componentes</h3><p>Tarjetas, tablas, avisos, chats, formularios, fichas de comunidad y módulos próximamente.</p></div><div class="card"><h3>Responsive</h3><p>Celular primero, luego tablet, PC y TV. Máximo 7 opciones principales por pantalla.</p></div></div><div class="section-title"><div><h2>Vista móvil de referencia</h2></div></div><div class="mock-phone"><div class="phone-top"></div><div class="phone-content"><h3>MiZona</h3><div class="phone-card">🔎 ¿Qué necesitas hoy?</div><div class="phone-card">🏫 Colegio San Martín · 2 avisos</div><div class="phone-card">💬 Aula Chat · Grupo Ciencia</div><div class="phone-card">🎁 Beneficios · Próximamente</div></div></div>`
};
function desc(id){return ({panel:'Pantalla principal personalizada según zona, rol y necesidades.',comunidad:'Colegios y comités serán el primer motor de usuarios.',chat:'Usuario único, invitaciones, aula chat y archivos temporales.',beneficios:'Ofertas y cupones cuando exista base de usuarios.',negocios:'Perfiles y promociones, luego Business.',servicios:'Profesionales y soluciones locales.',marketplace:'Compra, venta y oportunidades futuras.',business:'Gestión para negocios cuando el ecosistema crezca.',campus:'Cursos y aprendizaje en fase posterior.',ride:'Movilidad, delivery y envíos más adelante.'}[id]||'Módulo preparado para activarse desde administración.')}
function coming(id){const m=modules.find(x=>x.id===id); return `<div class="section-title"><div><h2>${m.icon} ${m.name}</h2><p>Este módulo existe en estructura, pero se activará cuando llegue su fase.</p></div>${tag(m.status)}</div><div class="card"><h3>🚧 Próximamente</h3><p>El administrador podrá activarlo, ocultarlo o ponerlo en mantenimiento sin cambiar el código.</p></div>`}
document.getElementById('toggleSidebar').onclick=()=>document.getElementById('sidebar').classList.toggle('open');
document.getElementById('globalSearch').addEventListener('keydown',e=>{if(e.key==='Enter'){alert('Prototipo: aquí MiZona buscará soluciones por necesidad, zona y rol.')}});
nav(); render();

  </script>
</body>
</html>
